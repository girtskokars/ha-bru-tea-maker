[project]
name = "ha-bru-tea-maker"
version = "1.0.0"
description = "Home Assistant integration for the BRU Maker One tea maker"
requires-python = ">=3.14"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "B",   # flake8-bugbear
    "BLE", # blind except
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "PL",  # pylint
    "RUF", # ruff-specific
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]
ignore = [
    "PLR0913", # Home Assistant callbacks take many arguments
    "PLR2004", # protocol constants read better inline in tests
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components", "homeassistant", "pytest_homeassistant_custom_component", "tests"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLC0415", "PLR0915"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["custom_components.bru_tea_maker"]
explicit_package_bases = true
